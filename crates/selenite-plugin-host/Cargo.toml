[package]
name = "selenite-plugin-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
selenite-core.workspace = true
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
ed25519-dalek = "2.2"
url = "2.5"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
wasmtime = { version = "=36.0.17", default-features = false, features = ["cranelift", "runtime", "std"] }

[dev-dependencies]
wat = "=1.236.1"
